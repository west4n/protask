services:
  postgres:
    image: postgres:16-alpine
    container_name: protask-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: protask
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - protask_postgres_data:/var/lib/postgresql/data

volumes:
  protask_postgres_data:
